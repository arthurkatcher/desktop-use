<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>desktop-use session</title>
<script>
  // apply the stored theme before first paint to avoid a flash
  const stored = localStorage.getItem('du-theme');
  if (stored) document.documentElement.dataset.theme = stored;
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tube: #0E1216;
    --chassis: #151B22;
    --chassis-2: #1B232D;
    --chassis-3: #212B36;
    --line: #27313C;
    --line-soft: rgba(39, 49, 60, .45);
    --paper: #E9E4D8;
    --muted: #8A94A1;
    --faint: #5A6470;
    --amber: #FFB454;
    --amber-deep: #C67F2A;
    --amber-glow: rgba(255, 180, 84, .16);
    --ok: #63B981;
    --bad: #E56470;
    --amber-hover: #FFC475;
    --on-amber: #0E1216;
    --glow-strong: rgba(255, 180, 84, .28);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --rail: 30px;
  }
  :root[data-theme="light"] {
    --tube: #EFEAE0; --chassis: #F7F4EC; --chassis-2: #ECE7DB;
    --chassis-3: #E0DACB; --line: #D3CCBC;
    --line-soft: rgba(120, 112, 96, .25);
    --paper: #232A32; --muted: #5F6873; --faint: #98A0AA;
    --amber: #B8721F; --amber-deep: #9A5E14; --amber-hover: #A5661B;
    --amber-glow: rgba(184, 114, 31, .18);
    --glow-strong: rgba(184, 114, 31, .30);
    --on-amber: #FFF8EC; --ok: #23784A; --bad: #B93A46;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --tube: #EFEAE0; --chassis: #F7F4EC; --chassis-2: #ECE7DB;
      --chassis-3: #E0DACB; --line: #D3CCBC;
      --line-soft: rgba(120, 112, 96, .25);
      --paper: #232A32; --muted: #5F6873; --faint: #98A0AA;
      --amber: #B8721F; --amber-deep: #9A5E14; --amber-hover: #A5661B;
      --amber-glow: rgba(184, 114, 31, .18);
      --glow-strong: rgba(184, 114, 31, .30);
      --on-amber: #FFF8EC; --ok: #23784A; --bad: #B93A46;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--tube); color: var(--paper); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  ::selection { background: var(--amber-deep); color: var(--on-amber); }

  /* ── operator strip ─────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 22px;
    padding: 0 20px; height: 54px; flex: none;
    border-bottom: 1px solid var(--line); background: var(--chassis);
    font-family: var(--mono); font-size: 12px;
  }
  .back {
    color: var(--muted); text-decoration: none; font-size: 11px;
    letter-spacing: .12em; padding: 7px 10px; margin-left: -10px;
    border-radius: 5px; transition: color .15s, background .15s;
  }
  .back:hover { color: var(--paper); background: var(--chassis-2); }
  .wordmark { display: flex; align-items: center; gap: 10px;
              font-weight: 600; letter-spacing: .18em; font-size: 13px; }
  .lamp { width: 9px; height: 9px; border-radius: 50%;
          background: var(--muted); flex: none; }
  .lamp.thinking { background: var(--amber);
                   animation: breathe 1.6s ease-in-out infinite; }
  /* idle is neutral wait, not error — same amber family as thinking */
  .lamp.idle { background: var(--amber);
               box-shadow: 0 0 0 3px var(--amber-glow); }
  .lamp.ok  { background: var(--ok); }
  .lamp.bad { background: var(--bad); }
  @keyframes breathe { 50% { opacity: .3; } }
  .gauges { display: flex; gap: 28px; margin-left: auto; }
  .gauge { display: flex; flex-direction: column; gap: 1px; }
  .gauge .k { color: var(--muted); font-size: 9px; letter-spacing: .16em; }
  .gauge .v { font-variant-numeric: tabular-nums; font-size: 13px; }
  .gauge .v .dim { color: var(--muted); }
  .session-actions {
    display: none; align-items: center; gap: 8px;
  }
  .session-actions.on { display: flex; }
  #stop-btn, #end-btn {
    font-family: var(--mono); font-weight: 600; font-size: 11px;
    letter-spacing: .08em; padding: 8px 14px;
    background: none; border-radius: 6px; cursor: pointer;
    transition: background .15s;
  }
  #stop-btn {
    color: var(--bad); border: 1px solid var(--bad);
  }
  #stop-btn:hover:not(:disabled) { background: rgba(229,100,112,.12); }
  #end-btn {
    color: var(--ok); border: 1px solid var(--ok);
  }
  #end-btn:hover:not(:disabled) { background: rgba(120,190,140,.12); }
  #stop-btn:disabled, #end-btn:disabled {
    color: var(--faint); border-color: var(--line); cursor: default;
  }
  #stop-btn:focus-visible, #end-btn:focus-visible {
    outline: 2px solid var(--paper); outline-offset: 2px;
  }
  #theme-btn {
    width: 32px; height: 32px; border-radius: 6px; flex: none;
    font-size: 14px; line-height: 1;
    background: none; border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  #theme-btn:hover { border-color: var(--amber-deep); color: var(--paper); }
  #theme-btn:focus-visible { outline: 2px solid var(--paper);
                             outline-offset: 2px; }

  /* ── layout ─────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }
  .left {
    width: 440px; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--chassis);
    min-height: 0;
  }
  .right { flex: 1; display: flex; flex-direction: column;
           align-items: center; justify-content: center;
           padding: 16px 28px 20px; gap: 12px; min-width: 0;
           --feedw: min(100%, calc((100vh - 220px) * 1.6)); }

  /* progress bar */
  .progress { height: 2px; flex: none; background: var(--line-soft);
              overflow: hidden; opacity: 0; transition: opacity .3s; }
  .progress.on { opacity: 1; }
  .progress span {
    display: block; height: 100%; width: 0%;
    background: var(--amber);
    transition: width .45s ease;
  }

  /* ── transcript ─────────────────────────────────── */
  .transcript { flex: 1; overflow-y: auto; padding: 16px 0 28px;
                scrollbar-width: thin;
                scrollbar-color: var(--chassis-3) transparent; }
  .transcript::-webkit-scrollbar { width: 8px; }
  .transcript::-webkit-scrollbar-thumb {
    background: var(--chassis-3); border-radius: 4px; }
  .transcript::-webkit-scrollbar-thumb:hover { background: var(--line); }

  .empty {
    margin: 26px 18px; padding: 26px 20px;
    border: 1px dashed var(--line); border-radius: 10px;
    color: var(--muted); font-size: 12.5px; line-height: 1.65;
  }
  .empty .ghost { font-family: var(--mono); color: var(--faint);
                  margin-top: 12px; font-size: 12px; }
  .empty .ghost::after { content: "▌";
                         animation: breathe 1.2s steps(2) infinite; }

  /* timeline card */
  .card {
    position: relative; margin: 0 12px 10px; padding: 12px 14px 12px 52px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--chassis-2) 88%, transparent),
      color-mix(in srgb, var(--chassis-2) 62%, transparent));
    border: 1px solid var(--line-soft); border-radius: 10px;
    animation: rise .28s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } }
  .card::before {
    content: ""; position: absolute; left: var(--rail); top: -11px;
    bottom: -1px; width: 1px; background: var(--line);
  }
  .card:first-child::before { top: 14px; }
  .card:last-child::before  { bottom: auto; height: 26px; }
  .node {
    position: absolute; left: calc(var(--rail) - 10px); top: 13px;
    width: 21px; height: 21px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--amber); background: var(--tube);
    border: 1px solid var(--line); z-index: 1;
    font-variant-numeric: tabular-nums;
  }
  .card.viewing { border-color: var(--amber-deep); }
  .card.viewing .node { border-color: var(--amber-deep); }
  .card.clickable { cursor: pointer;
                    transition: border-color .15s, transform .12s; }
  .card.clickable:hover:not(.viewing) {
    border-color: var(--line); transform: translateX(2px); }

  .card-head { display: flex; align-items: baseline; gap: 10px;
               margin-bottom: 6px; }
  .step-label { font-family: var(--mono); font-size: 10px;
                letter-spacing: .16em; color: var(--amber); }
  .lat { font-family: var(--mono); font-size: 10px; color: var(--faint);
         margin-left: auto; font-variant-numeric: tabular-nums; }
  .reasoning { font-size: 13px; line-height: 1.6; color: var(--paper); }

  .cmd {
    display: flex; align-items: center; gap: 7px; margin-top: 10px;
    font-family: var(--mono); font-size: 11.5px;
    background: var(--tube); border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 7px 10px;
    white-space: nowrap; overflow: hidden;
  }
  .cmd .pfx { color: var(--amber-deep); flex: none; }
  .cmd .verb { color: var(--amber); font-weight: 500; flex: none; }
  .cmd .args { color: var(--paper); overflow: hidden;
               text-overflow: ellipsis; }
  .cmd .res { margin-left: auto; padding-left: 12px; flex: none;
              font-size: 10.5px; color: var(--faint); }
  .cmd .res.changed::before { content: "✓ "; color: var(--ok); }
  .cmd .res.same::before    { content: "∅ "; color: var(--bad); }
  .cmd .res.same { color: var(--bad); }

  .card.ticket {
    background: none; border: 1px dashed var(--line); border-radius: 10px;
  }
  .card.ticket .node { border-color: var(--amber-deep); color: var(--amber); }
  .card.ticket .reasoning { color: var(--muted); font-size: 12.5px; }

  .card.note { background: none; border: none; padding-top: 4px;
               padding-bottom: 4px; color: var(--bad);
               font-size: 11px; font-family: var(--mono); }
  .card.note::before { top: -11px; bottom: -1px; }
  .card.note .node { width: 9px; height: 9px; border-radius: 50%;
                     left: calc(var(--rail) - 4px); top: 8px;
                     background: var(--bad); border: none; }
  .card.note.warn { color: var(--amber); }
  .card.note.warn .node { background: var(--amber); }

  .card.final .node { width: 23px; height: 23px; font-size: 12px; }
  .card.final.done-ok { border-color:
    color-mix(in srgb, var(--ok) 45%, var(--line));
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--ok) 9%, var(--chassis-2)),
      color-mix(in srgb, var(--ok) 3%, var(--chassis-2))); }
  .card.final.done-ok .node { color: var(--ok); border-color: var(--ok); }
  .card.final.done-ok .step-label { color: var(--ok); }
  .card.final.done-bad { border-color:
    color-mix(in srgb, var(--bad) 45%, var(--line));
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bad) 9%, var(--chassis-2)),
      color-mix(in srgb, var(--bad) 3%, var(--chassis-2))); }
  .card.final.done-bad .node { color: var(--bad); border-color: var(--bad); }
  .card.final.done-bad .step-label { color: var(--bad); }
  /* session closed cleanly (idle timeout) — amber, not success/error */
  .card.final.session-end { border-color:
    color-mix(in srgb, var(--amber) 45%, var(--line));
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--amber) 10%, var(--chassis-2)),
      color-mix(in srgb, var(--amber) 3%, var(--chassis-2))); }
  .card.final.session-end .node { color: var(--amber); border-color: var(--amber); }
  .card.final.session-end .step-label { color: var(--amber); }
  .card.final .reasoning { font-weight: 600; font-size: 13.5px; }
  .summary { margin-top: 5px; font-size: 12.5px; color: var(--muted);
             line-height: 1.6; }

  /* ── visual feed ────────────────────────────────── */
  .feed-head { width: var(--feedw); display: flex; align-items: baseline; }
  .feed-head .eyebrow { margin-bottom: 0; }
  .feed-head .sid { margin-left: auto; font-family: var(--mono);
                    font-size: 10px; color: var(--faint);
                    letter-spacing: .08em; }
  .monitor {
    position: relative; width: var(--feedw);
    border: 1px solid var(--line); border-radius: 6px;
    background: #000;
    transition: border-color .5s ease;
  }
  .monitor.touch { border-color: var(--amber); transition: none; }
  .monitor.touch .corner { border-color: var(--amber); }
  .corner { position: absolute; width: 15px; height: 15px; z-index: 2;
            pointer-events: none; border: 1px solid var(--amber-deep); }
  .corner.tl { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: -5px; right: -5px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: -5px; left: -5px; border-right: 0; border-top: 0; }
  .corner.br { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }
  .screen-clip { overflow: hidden; border-radius: 6px; }
  #screen { width: 100%; aspect-ratio: 1280 / 800; }
  #screen > div { background: transparent !important; }
  #snap { width: 100%; aspect-ratio: 1280 / 800;
          display: none; object-fit: contain; }
  .monitor.snapmode #screen { display: none; }
  .monitor.snapmode #snap { display: block; }

  /* ── control deck ───────────────────────────────── */
  .deck {
    width: var(--feedw); display: flex; align-items: center; gap: 20px;
    background: var(--chassis); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px;
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px;
         overflow: hidden; flex: none; }
  .seg button {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    background: none; border: none; color: var(--muted);
    padding: 8px 14px; cursor: pointer;
  }
  .seg button.active { background: var(--chassis-3); color: var(--amber); }
  .seg button:disabled { color: var(--faint); cursor: default; }
  .seg button:focus-visible { outline: 2px solid var(--paper);
                              outline-offset: -2px; }

  .tl-group { flex: 1; display: flex; align-items: center; gap: 8px;
              justify-content: center; min-width: 0; }
  .timeline { flex: 0 1 auto; max-width: 262px; /* ~15 dots */
              display: flex; align-items: center; gap: 6px;
              overflow-x: auto; padding: 6px 2px; min-width: 0;
              scroll-behavior: smooth; scrollbar-width: none; }
  .timeline::-webkit-scrollbar { display: none; }
  .tl-arrow {
    flex: none; width: 24px; height: 24px; border-radius: 5px;
    font-family: var(--mono); font-size: 14px; line-height: 1;
    background: none; border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .tl-arrow:hover:not(:disabled) { border-color: var(--amber-deep);
                                   color: var(--paper); }
  .tl-arrow:disabled { color: var(--faint); border-color: var(--line-soft);
                       cursor: default; }
  .tl-arrow:focus-visible { outline: 2px solid var(--paper);
                            outline-offset: 2px; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; flex: none;
    border: 1px solid var(--line); background: var(--chassis-2);
    cursor: pointer; padding: 0; transition: transform .12s;
  }
  .dot:hover { border-color: var(--amber); transform: scale(1.3); }
  .dot.latest { background: var(--amber-deep); border-color: var(--amber-deep); }
  .dot.sel { background: var(--amber); border-color: var(--amber); }
  .dot.final-ok  { background: var(--ok); border-color: var(--ok);
                   border-radius: 3px; }
  .dot.final-bad { background: var(--bad); border-color: var(--bad);
                   border-radius: 3px; }

  .readouts { display: flex; gap: 18px; flex: none; }
  .ro { display: flex; flex-direction: column; gap: 2px; }
  .ro .k { font-family: var(--mono); font-size: 8.5px;
           letter-spacing: .18em; color: var(--faint); }
  .ro .v { font-family: var(--mono); font-size: 11px; color: var(--paper);
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vnc-ok { color: var(--ok) !important; }
  .vnc-bad { color: var(--bad) !important; }

  #control-btn {
    flex: none; font-family: var(--mono); font-weight: 600;
    font-size: 10.5px; letter-spacing: .1em;
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 9px 14px; border-radius: 6px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #control-btn:hover:not(:disabled) { border-color: var(--amber-deep);
                                      color: var(--paper); }
  #control-btn.on { border-color: var(--amber); color: var(--amber); }
  #control-btn:disabled { color: var(--faint); cursor: default; }
  #control-btn:focus-visible { outline: 2px solid var(--paper);
                               outline-offset: 2px; }

  /* ── mid-flight message bar ─────────────────────── */
  .msgbar { display: none; gap: 8px; padding: 10px 12px; flex: none;
            border-top: 1px solid var(--line); background: var(--chassis); }
  .msgbar.on { display: flex; }
  #msg-input {
    flex: 1; min-width: 0; background: var(--tube); color: var(--paper);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: var(--mono); font-size: 12px; padding: 8px 11px;
  }
  #msg-input::placeholder { color: var(--faint); }
  #msg-input:focus { outline: none; border-color: var(--amber-deep);
                     box-shadow: 0 0 0 1px var(--amber-deep); }
  #msg-send {
    flex: none; font-family: var(--mono); font-weight: 600; font-size: 11px;
    letter-spacing: .08em; padding: 8px 14px;
    background: var(--amber); color: var(--on-amber);
    border: none; border-radius: 6px; cursor: pointer;
  }
  #msg-send:hover { background: var(--amber-hover); }
  #msg-send:focus-visible { outline: 2px solid var(--paper);
                            outline-offset: 2px; }

  /* user message card */
  .card.usermsg { background: none;
                  border: 1px dashed var(--amber-deep); }
  .card.usermsg .node { border-color: var(--amber-deep); }
  .card.usermsg .reasoning { font-size: 13px; }

  /* ── confirm modal ──────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55);
  }
  .overlay.open { display: flex; }
  .modal {
    width: min(440px, calc(100vw - 40px));
    background: var(--chassis); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px;
  }
  .modal .eyebrow { margin-bottom: 10px; }
  .modal p { font-size: 13px; line-height: 1.6; color: var(--paper);
             margin-bottom: 18px; }
  .modal-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-row button {
    font-family: var(--mono); font-weight: 600; font-size: 11px;
    letter-spacing: .08em; padding: 9px 14px; border-radius: 6px;
    cursor: pointer; border: 1px solid var(--line);
    background: none; color: var(--muted);
  }
  .modal-row button.primary { background: var(--amber);
    color: var(--on-amber); border-color: var(--amber); }
  .modal-row button.primary:hover { background: var(--amber-hover); }
  .modal-row button.danger { color: var(--bad); border-color: var(--bad); }
  .modal-row button.danger:hover { background: rgba(229,100,112,.12); }
  .modal-row button:hover { border-color: var(--amber-deep);
                            color: var(--paper); }
  .modal-row button.danger:hover { color: var(--bad);
                                   border-color: var(--bad); }
  .modal-row button:focus-visible { outline: 2px solid var(--paper);
                                    outline-offset: 2px; }

  @media (max-width: 980px) {
    main { flex-direction: column; overflow-y: auto; }
    .left { width: 100%; border-right: none;
            border-bottom: 1px solid var(--line); }
    .transcript { max-height: 40vh; }
    .right { padding: 16px; --feedw: 100%; }
    .gauges { gap: 14px; }
    .deck { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lamp.thinking, .card, .empty .ghost::after { animation: none; }
    .monitor, .monitor.touch, .card.clickable, .back { transition: none; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="/">‹ SESSIONS</a>
  <div class="wordmark"><span class="lamp" id="lamp"></span>DESKTOP·USE</div>
  <div class="gauges">
    <div class="gauge"><span class="k" id="g-step-k">STEP</span>
      <span class="v" id="g-step">–<span class="dim">/–</span></span></div>
    <div class="gauge"><span class="k">ELAPSED</span>
      <span class="v" id="g-clock">0:00</span></div>
    <div class="gauge"><span class="k">MODEL</span>
      <span class="v" id="g-model">–</span></div>
    <div class="gauge"><span class="k">DISPLAY</span>
      <span class="v" id="g-display">–</span></div>
  </div>
  <div class="session-actions" id="session-actions">
    <button id="end-btn" title="End session successfully (status: complete)">END</button>
    <button id="stop-btn" title="Abort session (status: stopped)">STOP</button>
  </div>
  <button id="theme-btn" title="Toggle light/dark theme">◐</button>
</header>

<main>
  <div class="left">
    <div class="progress" id="progress"><span></span></div>
    <div class="transcript" id="transcript">
      <div class="empty" id="empty">
        Waiting for this session's stream…
        <div class="ghost">❯ connecting </div>
      </div>
    </div>
    <div class="msgbar" id="msgbar">
      <input id="msg-input" spellcheck="false"
        placeholder="Message the agent mid-task…">
      <button id="msg-send">SEND</button>
    </div>
  </div>

  <div class="right">
    <div class="feed-head">
      <span class="eyebrow">VISUAL FEED</span>
      <span class="sid" id="feed-sid"></span>
    </div>
    <div class="monitor" id="monitor">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="screen-clip">
        <div id="screen"></div>
        <img id="snap" alt="Step snapshot">
      </div>
    </div>
    <div class="deck">
      <div class="seg">
        <button id="seg-live" class="active">LIVE</button>
        <button id="seg-steps">SNAPSHOTS</button>
      </div>
      <div class="tl-group">
        <button class="tl-arrow" id="tl-prev" title="Previous snapshot">‹</button>
        <div class="timeline" id="dots"></div>
        <button class="tl-arrow" id="tl-next" title="Next snapshot">›</button>
      </div>
      <div class="readouts">
        <div class="ro"><span class="k">SIGNAL</span>
          <span class="v vnc-bad" id="ro-signal">…</span></div>
        <div class="ro"><span class="k">RES</span>
          <span class="v" id="ro-res">–</span></div>
        <div class="ro"><span class="k">VIEW</span>
          <span class="v" id="ro-view">LIVE</span></div>
      </div>
      <button id="control-btn"
        title="Let your mouse and keyboard reach the desktop">TAKE CONTROL</button>
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="eyebrow" id="modal-title"></div>
    <p id="modal-text"></p>
    <div class="modal-row" id="modal-row"></div>
  </div>
</div>

<script type="module">
import RFB from '/novnc/core/rfb.js';

const $ = id => document.getElementById(id);
const transcript = $('transcript');
const sid = decodeURIComponent(location.pathname.split('/').pop());

/* ── live VM ─────────────────────────────────────── */
let rfb = null, vncUp = false;
function connectVNC() {
  // Server replaces only the value token below for remote sandbox mode.
  // Unreplaced / empty keeps the local websockify port. Guard uses a
  // different pattern so the replace cannot make the check self-defeating.
  const injected = '__STREAM_URL__';
  const streamUrl = (injected && !injected.startsWith('__'))
    ? injected
    : `ws://${location.hostname}:__WS_PORT__`;
  rfb = new RFB($('screen'), streamUrl);
  rfb.viewOnly = true;
  rfb.scaleViewport = true;
  rfb.addEventListener('connect', () => { vncUp = true; refreshLabel(); });
  rfb.addEventListener('disconnect', () => {
    vncUp = false; refreshLabel();
    setTimeout(connectVNC, 2000);
  });
}
connectVNC();

/* ── modal ───────────────────────────────────────── */
function modal(title, text, buttons) {
  $('modal-title').textContent = title;
  $('modal-text').textContent = text;
  const row = $('modal-row');
  row.innerHTML = '';
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', () => { $('overlay').classList.remove('open'); fn?.(); });
    row.appendChild(b);
  }
  $('overlay').classList.add('open');
}

/* ── take / release control ──────────────────────── */
// sessionLive: desktop session open (running or idle). agentBusy: model loop.
let running = false, agentBusy = false, controlHeld = false, pausedRun = false;
let idleTimeoutS = 60;
const MSG_PLACEHOLDER_RUN = 'Message the agent mid-task…';
const MSG_PLACEHOLDER_IDLE = 'Session idle — send a message to continue…';

function grantControl() {
  if (!running) return;  // never drive desktop after session end
  controlHeld = true;
  if (rfb) rfb.viewOnly = false;
  $('control-btn').classList.add('on');
  $('control-btn').textContent = 'RELEASE CONTROL';
  setMode('live');
  refreshLabel();
}
function revokeControl() {
  controlHeld = false;
  pausedRun = false;
  if (rfb) rfb.viewOnly = true;
  $('control-btn').classList.remove('on');
  $('control-btn').textContent = 'TAKE CONTROL';
  refreshLabel();
}
/** Session finished (stop / error / idle timeout): lock out control + VNC input. */
function lockControlEnded(why) {
  running = false;
  agentBusy = false;
  pausedRun = false;
  if (controlHeld) revokeControl();
  else if (rfb) rfb.viewOnly = true;
  $('control-btn').disabled = true;
  $('control-btn').title = why
    || 'session has ended — take control is only available while a session is live';
  $('control-btn').classList.remove('on');
  $('control-btn').textContent = 'TAKE CONTROL';
}

$('control-btn').addEventListener('click', () => {
  if (!running || $('control-btn').disabled) return;
  if (!controlHeld) {
    const body = agentBusy
      ? 'Taking control pauses the agent: it will finish deciding its ' +
        'current step but execute nothing until you hand the desktop back.'
      : 'Session is idle. Take the desktop; the agent stays parked until ' +
        'you release control (and will only act after a new message).';
    modal('TAKE CONTROL', body,
      [['PAUSE AGENT & TAKE CONTROL', 'primary', async () => {
         if (!running) return;
         await fetch('/control/take', { method: 'POST' });
         pausedRun = true;
         grantControl();
       }],
       ['CANCEL', '', null]]);
  } else {
    if (pausedRun && running) {
      modal('RELEASE CONTROL',
        'Hand the desktop back. Should the agent continue the task from ' +
        'the current screen state, or stop the session here?',
        [['CONTINUE TASK', 'primary', async () => {
           await fetch('/control/release', { method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({ continue: true }) });
           revokeControl();
         }],
         ['STOP SESSION', 'danger', async () => {
           await fetch('/control/release', { method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({ continue: false }) });
           revokeControl();
         }],
         ['KEEP CONTROL', '', null]]);
    } else {
      revokeControl();
    }
  }
});

/* ── view modes ──────────────────────────────────── */
let mode = 'live';
let shots = [];
let selected = -1;
let follow = true;

function refreshLabel() {
  const sig = $('ro-signal');
  sig.textContent = vncUp ? 'LIVE' : 'NO LINK';
  sig.className = 'v ' + (vncUp ? 'vnc-ok' : 'vnc-bad');
  $('ro-view').textContent = mode === 'live'
    ? (typeof controlHeld !== 'undefined' && controlHeld ? 'CONTROL' : 'LIVE')
    : selected >= 0 ? `SNAP ${shots[selected].label}` : '—';
}

function setMode(m) {
  mode = m;
  $('monitor').classList.toggle('snapmode', m === 'steps');
  $('seg-live').classList.toggle('active', m === 'live');
  $('seg-steps').classList.toggle('active', m === 'steps');
  if (m === 'steps' && selected < 0 && shots.length) select(shots.length - 1);
  refreshLabel();
}
$('seg-live').addEventListener('click', () => setMode('live'));
$('seg-steps').addEventListener('click', () => setMode('steps'));

function select(i, fromUser = false) {
  if (i < 0 || i >= shots.length) return;
  selected = i;
  if (fromUser) follow = i === shots.length - 1;
  $('snap').src = shots[i].url;
  [...$('dots').children].forEach((d, j) => {
    d.classList.toggle('sel', j === i);
    if (j === i) d.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  });
  $('tl-prev').disabled = i <= 0;
  $('tl-next').disabled = i >= shots.length - 1;
  document.querySelectorAll('.card.viewing')
    .forEach(c => c.classList.remove('viewing'));
  shots[i].cardEl?.classList.add('viewing');
  if (fromUser) shots[i].cardEl?.scrollIntoView({ block: 'nearest' });
  refreshLabel();
}

$('tl-prev').addEventListener('click', () => {
  setMode('steps');
  select(selected < 0 ? shots.length - 1 : selected - 1, true);
});
$('tl-next').addEventListener('click', () => {
  setMode('steps');
  select(selected < 0 ? shots.length - 1 : selected + 1, true);
});

function addShot(label, url, cls = '') {
  const i = shots.length;
  shots.push({ label, url, cls, cardEl: null });
  const d = document.createElement('button');
  d.className = 'dot ' + cls;
  d.title = `step ${label}`;
  d.addEventListener('click', () => { setMode('steps'); select(i, true); });
  const dots = $('dots');
  dots.querySelector('.latest')?.classList.remove('latest');
  if (!cls) d.classList.add('latest');
  dots.appendChild(d);
  dots.scrollLeft = dots.scrollWidth;
  if (mode === 'steps' && follow) select(i);
  return i;
}

document.addEventListener('keydown', e => {
  if (mode !== 'steps' || document.activeElement === $('msg-input')) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft')
    select(Math.max(0, selected - 1), true);
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight')
    select(Math.min(shots.length - 1, selected + 1), true);
});

/* ── streaming transcript ────────────────────────── */
let maxSteps = 15, live = false, lastStepN = 0;
const pendingMsgs = [];
function userCard(text) {
  card(`<div class="node">»</div>
        <div class="card-head"><span class="step-label">YOU</span></div>
        <div class="reasoning">${esc(text)}</div>`, 'usermsg');
}
let clockTimer = null, clockAnchor = null;   // Date.now()-based
let runStartTs = null, lastStepTs = null;    // event-ts based
let lastDecision = null, pendingShotIdx = -1;
const lamp = $('lamp');

function card(html, cls = '') {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'card ' + cls;
  el.innerHTML = html;
  transcript.appendChild(el);
  const nearBottom = transcript.scrollHeight - transcript.scrollTop
                     - transcript.clientHeight < 180;
  if (nearBottom) transcript.scrollTop = transcript.scrollHeight;
  return el;
}
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cmdParts(a) {
  const t = a.type;
  if (t === 'click' || t === 'double_click' || t === 'right_click' || t === 'move')
    return [t, `${a.x}, ${a.y}`];
  if (t === 'type')   return ['type', `"${a.text}"`];
  if (t === 'click_type') return ['click_type', `${a.x}, ${a.y} "${a.text}"`];
  if (t === 'key')    return ['key', a.combo];
  if (t === 'scroll') return ['scroll', `${a.direction} × ${a.amount ?? 3}`];
  if (t === 'wait')   return ['wait', `${a.seconds}s`];
  if (t === 'done')   return ['done', a.success ? 'success' : 'failed'];
  return [t ?? '?', ''];
}

const fmtClock = s => `${Math.floor(s / 60)}:${String(Math.round(s) % 60)
                        .padStart(2, '0')}`;

function tickClock() {
  if (clockAnchor !== null)
    $('g-clock').textContent =
      fmtClock((Date.now() - clockAnchor) / 1000);
}

function setProgress(n) {
  $('progress').querySelector('span').style.width =
    `${Math.round(n / maxSteps * 100)}%`;
}

function handle(ev) {
  // keep the wall clock anchored to server event timestamps
  if (live && runStartTs !== null && ev.ts)
    clockAnchor = Date.now() - (ev.ts - runStartTs) * 1000;

  switch (ev.t) {
    case 'hello':
      $('g-model').textContent = ev.model.split('/').pop();
      $('g-display').textContent = `${ev.display} ${ev.width}×${ev.height}`;
      $('ro-res').textContent = `${ev.width}×${ev.height}`;
      $('feed-sid').textContent = `SESSION ${sid}`;
      maxSteps = ev.max_steps;
      live = ev.live;
      if (ev.idle_timeout != null) idleTimeoutS = Number(ev.idle_timeout);
      if (!live) {
        // finished session or another session owns the desktop
        $('seg-live').disabled = true;
        lockControlEnded(
          'only the active session can take the desktop');
      } else if (ev.status === 'idle' || ev.status === 'running') {
        // reconnect mid-session: keep message bar / stop / control available
        running = true;
        agentBusy = ev.status === 'running';
        $('control-btn').disabled = false;
        $('control-btn').title =
          'Let your mouse and keyboard reach the desktop';
        showSessionActions(true);
        $('msgbar').classList.add('on');
        $('msg-input').placeholder = agentBusy
          ? MSG_PLACEHOLDER_RUN : MSG_PLACEHOLDER_IDLE;
        if (ev.status === 'idle') lamp.className = 'lamp idle';
      } else {
        // live connection but status already terminal (race on reconnect)
        lockControlEnded('session has ended');
      }
      break;
    case 'run_start':
      runStartTs = ev.ts;
      running = true;
      agentBusy = true;
      lamp.className = 'lamp thinking';
      if (live) {
        clockAnchor = Date.now();
        clearInterval(clockTimer);
        clockTimer = setInterval(tickClock, 500);
        showSessionActions(true);
        $('control-btn').disabled = false;
        $('control-btn').title =
          'Let your mouse and keyboard reach the desktop';
        $('progress').classList.add('on');
        $('msgbar').classList.add('on');
        $('msg-input').placeholder = MSG_PLACEHOLDER_RUN;
      }
      if (ev.idle_timeout != null) idleTimeoutS = Number(ev.idle_timeout);
      setProgress(0);
      card(`<div class="node">▶</div>
            <div class="card-head"><span class="step-label">RUN</span></div>
            <div class="reasoning">${esc(ev.task)}</div>`, 'ticket');
      break;
    case 'step':
      lastStepTs = ev.ts;
      lastStepN = ev.n;
      $('g-step').innerHTML =
        `${String(ev.n).padStart(2, '0')}<span class="dim">/${maxSteps}</span>`;
      setProgress(ev.n);
      pendingShotIdx = ev.shot
        ? addShot(String(ev.n).padStart(2, '0'), ev.shot) : -1;
      break;
    case 'decision': {
      const [verb, args] = cmdParts(ev.action);
      const lat = lastStepTs ? (ev.ts - lastStepTs).toFixed(1) + 's' : '';
      lastDecision = card(
        `<div class="node">${String(ev.n).padStart(2, '0')}</div>
         <div class="card-head">
           <span class="step-label">STEP ${String(ev.n).padStart(2, '0')}</span>
           <span class="lat">${lat}</span>
         </div>
         <div class="reasoning">${esc(ev.reasoning)}</div>
         <div class="cmd"><span class="pfx">❯</span><span class="verb">${esc(verb)}</span><span class="args">${esc(args)}</span><span class="res"></span></div>`,
        'clickable');
      if (pendingShotIdx >= 0) {
        const i = pendingShotIdx;
        shots[i].cardEl = lastDecision;
        lastDecision.addEventListener('click',
          () => { setMode('steps'); select(i, true); });
      }
      if (live && ev.action.type !== 'done' && ev.action.type !== 'wait') {
        const m = $('monitor');
        m.classList.add('touch');
        setTimeout(() => m.classList.remove('touch'), 650);
      }
      break;
    }
    case 'result':
      if (lastDecision) {
        const res = lastDecision.querySelector('.res');
        res.classList.add(ev.changed ? 'changed' : 'same');
        res.textContent = ev.changed ? 'screen changed' : 'no change';
      }
      break;
    case 'skipped':
      if (lastDecision) {
        const res = lastDecision.querySelector('.res');
        res.classList.add('same');
        res.textContent = 'not executed';
      }
      break;
    case 'message_sent':          // live echo: render immediately
      pendingMsgs.push(ev.text);
      userCard(ev.text);
      break;
    case 'user_message': {        // persisted at ingestion: replay + dedupe
      const i = pendingMsgs.indexOf(ev.text);
      if (i >= 0) pendingMsgs.splice(i, 1);
      else userCard(ev.text);
      break;
    }
    case 'control_taken':
      lamp.className = 'lamp';
      card(`<div class="node"></div>Manual control taken — agent paused
            until the desktop is handed back.`, 'note warn');
      break;
    case 'control_returned':
      if (ev.resumed) {
        lamp.className = 'lamp thinking';
        card(`<div class="node"></div>Control returned — agent resuming
              the task from the current screen.`, 'note warn');
      }
      break;
    case 'note':
      card(`<div class="node"></div>${esc(ev.msg)}`, 'note');
      break;
    case 'stop_requested':
      card(`<div class="node"></div>Stop signal sent — finishing the current
            step; the pending action will not run.`, 'note warn');
      disableSessionActions('STOPPING…', 'END');
      break;
    case 'end_requested':
      card(`<div class="node"></div>End signal sent — finishing the current
            step; session will close as complete.`, 'note warn');
      disableSessionActions('STOP', 'ENDING…');
      break;
    case 'done': {
      // Task milestone (agent finished → idle) or session end
      // (stop / end / timeout). terminal + reason distinguish them.
      agentBusy = false;
      const total = runStartTs ? fmtClock(ev.ts - runStartTs) : '';
      if (total) $('g-clock').textContent = total;
      $('g-step-k').textContent = 'STEPS';
      $('g-step').innerHTML =
        `${String(lastStepN).padStart(2, '0')}<span class="dim"> total</span>`;
      // timeout may be tagged (reason) or only in summary on older sessions
      const sum = String(ev.summary || '');
      const isIdleTimeout = ev.reason === 'idle_timeout'
        || /idle timeout/i.test(sum);
      const isUserEnd = ev.reason === 'ended';
      const term = !!ev.terminal || isIdleTimeout || ev.reason === 'stopped'
        || isUserEnd;
      let label, headline, cls, lampCls, node, shotCls;
      if (isIdleTimeout) {
        label = 'SESSION ENDED';
        headline = 'Session ended';
        cls = 'session-end';
        lampCls = 'lamp idle';
        node = '–';
        shotCls = '';
      } else if (isUserEnd && ev.ok) {
        label = 'COMPLETE';
        headline = 'Session ended';
        cls = 'done-ok';
        lampCls = 'lamp ok';
        node = '✓';
        shotCls = 'final-ok';
      } else if (term && !ev.ok) {
        label = 'STOPPED';
        headline = 'Session stopped';
        cls = 'done-bad';
        lampCls = 'lamp bad';
        node = '✕';
        shotCls = 'final-bad';
      } else if (ev.ok) {
        // task complete; session usually stays open (idle follows)
        label = 'COMPLETE';
        headline = 'Task complete';
        cls = 'done-ok';
        lampCls = 'lamp ok';
        node = '✓';
        shotCls = 'final-ok';
      } else {
        label = 'STOPPED';
        headline = 'Task did not finish';
        cls = 'done-bad';
        lampCls = 'lamp bad';
        node = '✕';
        shotCls = 'final-bad';
      }
      lamp.className = lampCls;
      const el = card(
        `<div class="node">${node}</div>
         <div class="card-head">
           <span class="step-label">${label}</span>
           <span class="lat">${total}</span>
         </div>
         <div class="reasoning">${headline}</div>
         <div class="summary">${esc(ev.summary)}</div>`,
        'final ' + cls);
      if (ev.shot) {
        const i = addShot(term ? 'END' : (ev.ok ? 'DONE' : 'END'),
                          ev.shot, shotCls);
        shots[i].cardEl = el;
        el.classList.add('clickable');
        el.addEventListener('click',
          () => { setMode('steps'); select(i, true); });
      }
      // terminal done: lock control immediately; run_end reinforces.
      // Task-complete (non-terminal) stays open for idle resume.
      if (term) {
        let why = 'session has ended — take control unavailable';
        if (isIdleTimeout) why = 'session ended — take control unavailable';
        else if (isUserEnd) why = 'session complete — take control unavailable';
        else if (ev.reason === 'stopped')
          why = 'session stopped — take control unavailable';
        lockControlEnded(why);
      }
      break;
    }
    case 'idle': {
      agentBusy = false;
      lamp.className = 'lamp idle';
      $('progress').classList.remove('on');
      if (live) {
        $('msgbar').classList.add('on');
        $('msg-input').placeholder = MSG_PLACEHOLDER_IDLE;
        showSessionActions(true);
      }
      const toS = Number(ev.timeout_s ?? idleTimeoutS);
      const toLabel = toS >= 60
        ? `${Math.round(toS / 60)} min`
        : `${Math.round(toS)}s`;
      card(`<div class="node">…</div>Idle — send a message to continue,
            End to finish successfully, or Stop to abort.
            Auto-ends after ${toLabel} without activity.`,
           'note warn');
      break;
    }
    case 'resumed':
      agentBusy = true;
      lamp.className = 'lamp thinking';
      if (live) {
        $('progress').classList.add('on');
        $('msg-input').placeholder = MSG_PLACEHOLDER_RUN;
      }
      card(`<div class="node">▶</div>Resuming from idle — new message(s)
            are the current objective.`, 'note warn');
      break;
    case 'error':
      agentBusy = false;
      lamp.className = 'lamp bad';
      card(`<div class="node">✕</div>
            <div class="card-head"><span class="step-label">ERROR</span></div>
            <div class="reasoning">${esc(ev.msg)}</div>`, 'final done-bad');
      lockControlEnded('session errored — take control unavailable');
      break;
    case 'run_end':
      clearInterval(clockTimer);
      clockAnchor = null;
      showSessionActions(false);
      $('progress').classList.remove('on');
      $('msgbar').classList.remove('on');
      lockControlEnded('session has ended — take control unavailable');
      requestAnimationFrame(() =>
        transcript.scrollTop = transcript.scrollHeight);
      break;
    case 'eof':
      // finished session: land on its snapshots, newest first
      es.close();
      if (shots.length) { setMode('steps'); select(shots.length - 1); }
      requestAnimationFrame(() =>
        transcript.scrollTop = transcript.scrollHeight);
      break;
  }
}

// dedupe across EventSource auto-reconnects: the server replays the whole
// history on reconnect, which would re-render every card (the "blink")
let maxSeq = -1;
const es = new EventSource(`/events?sid=${encodeURIComponent(sid)}`);
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  if ('seq' in ev) {
    if (ev.seq <= maxSeq) return;
    maxSeq = ev.seq;
  }
  handle(ev);
};

function showSessionActions(on) {
  const wrap = $('session-actions');
  if (on) {
    wrap.classList.add('on');
    $('stop-btn').disabled = false;
    $('stop-btn').textContent = 'STOP';
    $('end-btn').disabled = false;
    $('end-btn').textContent = 'END';
  } else {
    wrap.classList.remove('on');
    $('stop-btn').disabled = false;
    $('stop-btn').textContent = 'STOP';
    $('end-btn').disabled = false;
    $('end-btn').textContent = 'END';
  }
}
function disableSessionActions(stopLabel, endLabel) {
  $('stop-btn').disabled = true;
  $('stop-btn').textContent = stopLabel;
  $('end-btn').disabled = true;
  $('end-btn').textContent = endLabel;
}

$('stop-btn').addEventListener('click', () => {
  disableSessionActions('STOPPING…', 'END');
  fetch('/stop', { method: 'POST' });
});
$('end-btn').addEventListener('click', () => {
  disableSessionActions('STOP', 'ENDING…');
  fetch('/end', { method: 'POST' });
});

/* ── mid-flight messages ─────────────────────────── */
function sendMsg() {
  const text = $('msg-input').value.trim();
  if (!text) return;
  $('msg-input').value = '';
  fetch('/message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
}
$('msg-send').addEventListener('click', sendMsg);
$('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMsg();
});

/* ── theme ───────────────────────────────────────── */
const effTheme = () => document.documentElement.dataset.theme
  || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function paintThemeBtn() {
  $('theme-btn').textContent = effTheme() === 'dark' ? '☀' : '☾';
}
$('theme-btn').addEventListener('click', () => {
  const next = effTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('du-theme', next);
  paintThemeBtn();
});
matchMedia('(prefers-color-scheme: light)')
  .addEventListener('change', paintThemeBtn);
paintThemeBtn();
</script>
</body>
</html>
